<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aria · AI Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080f;
    --panel: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.10);
    --text: #eef0ff;
    --muted: #8d92b3;
    --accent: #7c5cff;
    --accent-2: #19d3da;
    --pink: #ff5ca8;
    --danger: #ff5c7a;
    --level: 0;           /* live audio level 0..1, set from JS */
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Space Grotesk", var(--font);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- animated background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .b1 { width: 480px; height: 480px; background: var(--accent);   top: -140px; left: -120px; }
  .b2 { width: 420px; height: 420px; background: var(--accent-2); bottom: -160px; right: -100px; animation-delay: -6s; }
  .b3 { width: 320px; height: 320px; background: var(--pink);     top: 45%; left: 55%; opacity: .25; animation-delay: -11s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(60px, 40px) scale(1.15); }
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }

  /* ---------- app card ---------- */
  .app {
    position: relative; z-index: 1;
    width: min(980px, 94vw);
    height: min(640px, 92vh);
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 28px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    overflow: hidden;
  }

  /* ---------- left: orb stage ---------- */
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 28px 24px 30px;
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .brand { align-self: stretch; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .logo i {
    width: 28px; height: 28px; border-radius: 9px; display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px rgba(124, 92, 255, .6);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--muted);
    transition: all .3s;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #5b6085; transition: background .3s, box-shadow .3s; }
  .pill.live { color: #c9fff3; }
  .pill.live .dot { background: #2ee6a6; box-shadow: 0 0 10px #2ee6a6; animation: blink 1.6s infinite; }
  .pill.error .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
  @keyframes blink { 50% { opacity: .35; } }

  .orb-wrap { position: relative; width: 260px; height: 260px; display: grid; place-items: center; }

  .ring {
    position: absolute; border-radius: 50%; border: 1px solid rgba(124, 92, 255, .35);
    inset: calc(0px - var(--i) * 22px);
    opacity: 0; transform: scale(.9);
  }
  .orb-wrap.active .ring { animation: ripple 3s ease-out infinite; animation-delay: calc(var(--i) * .8s); }
  @keyframes ripple {
    0%   { opacity: .6; transform: scale(.82); }
    100% { opacity: 0;  transform: scale(1.25); }
  }

  .orb {
    position: relative; width: 190px; height: 190px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.75), transparent 38%),
      radial-gradient(circle at 70% 75%, var(--pink), transparent 55%),
      radial-gradient(circle at 35% 70%, var(--accent-2), transparent 60%),
      linear-gradient(135deg, var(--accent), #3a2bd1);
    box-shadow:
      0 0 calc(40px + var(--level) * 90px) rgba(124, 92, 255, calc(.45 + var(--level) * .5)),
      inset 0 -14px 40px rgba(0,0,0,.35);
    transform: scale(calc(1 + var(--level) * .22));
    transition: transform .08s linear, filter .4s;
    animation: float 6s ease-in-out infinite, spin 14s linear infinite;
    filter: saturate(.55) brightness(.8);
  }
  .orb-wrap.active .orb { filter: saturate(1.1) brightness(1); }
  .orb::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,.18), transparent 40%);
    mix-blend-mode: overlay; animation: spin 5s linear infinite;
  }
  .orb-wrap[data-state="thinking"] .orb { animation: float 6s ease-in-out infinite, spin 14s linear infinite, pulse 1.1s ease-in-out infinite; }
  @keyframes float { 50% { translate: 0 -8px; } }
  @keyframes spin  { to  { rotate: 360deg; } }
  @keyframes pulse { 50% { opacity: .65; } }

  .status { text-align: center; min-height: 64px; }
  .status h2 { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .2px; }
  .status p  { margin-top: 6px; font-size: 13.5px; color: var(--muted); }

  .bars { display: flex; align-items: center; justify-content: center; gap: 4px; height: 26px; margin-top: 4px; }
  .bars span {
    width: 4px; height: 6px; border-radius: 4px;
    background: linear-gradient(var(--accent-2), var(--accent));
    transition: height .08s linear, opacity .3s; opacity: .35;
  }
  .orb-wrap.active ~ .bars span { opacity: 1; }

  .controls { display: flex; gap: 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px; padding: 0 26px; border-radius: 16px; border: 1px solid var(--border);
    font: 600 15px var(--font); color: var(--text); cursor: pointer;
    background: rgba(255,255,255,.07);
    transition: transform .15s, background .2s, box-shadow .2s, opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.primary {
    border: none; padding: 0 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px rgba(124, 92, 255, .45);
  }
  .btn.primary:hover { box-shadow: 0 14px 38px rgba(124, 92, 255, .65); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn.end { background: rgba(255, 92, 122, .15); border-color: rgba(255, 92, 122, .45); color: #ffd3dc; }
  .btn.end:hover { background: rgba(255, 92, 122, .28); }
  .btn.icon { width: 52px; padding: 0; }
  .btn.muted { background: rgba(255, 92, 122, .2); border-color: rgba(255, 92, 122, .5); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .hidden { display: none !important; }
  .unlock {
    height: 40px; margin-top: 12px; padding: 0 18px; font-size: 13px; border-radius: 12px;
    background: rgba(255, 190, 60, .16); border-color: rgba(255, 190, 60, .5); color: #ffe6b0;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .chk {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--border); transition: all .3s;
  }
  .chk::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5b6085; }
  .chk.ok { color: #c9fff3; border-color: rgba(46, 230, 166, .45); }
  .chk.ok::before { background: #2ee6a6; box-shadow: 0 0 8px #2ee6a6; }
  .warn {
    margin-top: 12px; padding: 10px 14px; border-radius: 12px; font-size: 12.5px; line-height: 1.5; text-align: left;
    background: rgba(255, 190, 60, .12); border: 1px solid rgba(255, 190, 60, .45); color: #ffe6b0;
  }
  .warn code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
  .foot label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin-left: 10px; color: var(--text); }
  .foot input { accent-color: var(--accent); }

  /* ---------- right: transcript ---------- */
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat-head {
    padding: 24px 26px 14px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .chat-head h3 { font-family: var(--display); font-size: 17px; }
  .chat-head small { color: var(--muted); font-size: 12px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 6px; }

  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.7; max-width: 260px; }
  .empty b { color: var(--text); font-family: var(--display); font-size: 17px; display: block; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chips span { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.04); }

  .msg { display: flex; flex-direction: column; max-width: 86%; animation: pop .3s ease; }
  .msg .who { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .msg .bubble { padding: 11px 15px; font-size: 14.5px; line-height: 1.55; border-radius: 18px; word-wrap: break-word; }
  .msg.agent { align-self: flex-start; }
  .msg.agent .bubble { background: rgba(255,255,255,.07); border: 1px solid var(--border); border-top-left-radius: 6px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: linear-gradient(135deg, rgba(124,92,255,.85), rgba(25,211,218,.75)); border-top-right-radius: 6px; color: #fff; }
  .msg.interim .bubble { opacity: .7; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .foot { padding: 12px 22px 18px; font-size: 12px; color: var(--muted); text-align: center; border-top: 1px solid var(--border); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; z-index: 5; left: 50%; bottom: 24px; transform: translate(-50%, 30px);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; max-width: 90vw;
    background: rgba(255, 92, 122, .18); border: 1px solid rgba(255, 92, 122, .5); color: #ffe0e6;
    backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: all .35s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- responsive ---------- */
  @media (max-width: 800px) {
    body { overflow: auto; align-items: flex-start; }
    .app { grid-template-columns: 1fr; height: auto; margin: 3vh 0; }
    .stage { border-right: none; border-bottom: 1px solid var(--border); gap: 20px; }
    .chat { height: 380px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .orb, .orb::after, .ring { animation: none !important; }
  }
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div></div>

<main class="app">
  <!-- LEFT: orb -->
  <section class="stage">
    <div class="brand">
      <div class="logo"><i></i>Aria</div>
      <div class="pill" id="pill"><span class="dot"></span><span id="pillText">Offline</span></div>
    </div>

    <div>
      <div class="orb-wrap" id="orbWrap" data-state="idle">
        <div class="ring" style="--i:1"></div>
        <div class="ring" style="--i:2"></div>
        <div class="ring" style="--i:3"></div>
        <div class="orb" id="orb"></div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="status">
      <h2 id="statusTitle">Ready when you are</h2>
      <p id="statusSub">Press Start and say hello.</p>
      <button class="btn unlock hidden" id="unlockBtn">Tap to enable sound</button>
      <div class="checks hidden" id="checks">
        <span class="chk" id="chkConn">Connected</span>
        <span class="chk" id="chkAgent">Agent joined</span>
        <span class="chk" id="chkAudio">Agent audio</span>
        <span class="chk" id="chkHeard">Heard you</span>
      </div>
      <div class="warn hidden" id="warnMsg"></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        <span id="startLabel">Start conversation</span>
      </button>
      <button class="btn icon" id="testBtn" title="Test your speakers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button class="btn icon hidden" id="muteBtn" title="Mute microphone">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      </button>
      <button class="btn end hidden" id="endBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 1-2.4-3l1.3-1.3a2 2 0 0 0 .4-2.1L8.9 4.2A2 2 0 0 0 6.7 3H4a2 2 0 0 0-2 2.2A19 19 0 0 0 21 22a2 2 0 0 0 2-2v-2.7a2 2 0 0 0-1.2-2.2l-2.7-1a2 2 0 0 0-2.1.4l-1.3 1.3"/><path d="M2 2l20 20"/></svg>
        End
      </button>
    </div>
  </section>

  <!-- RIGHT: transcript -->
  <section class="chat">
    <div class="chat-head">
      <h3>Live transcript</h3>
      <small id="roomLabel">Not connected</small>
    </div>
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <b>Say something!</b>
        Your conversation appears here in real time.
        <div class="chips"><span>“Who are you?”</span><span>“What time is it?”</span><span>“Explain AI simply”</span></div>
      </div>
    </div>
    <div class="foot">Powered by LiveKit · Use headphones<label title="Reads replies aloud with your browser voice if the agent audio is silent"><input type="checkbox" id="fbToggle" checked> Backup voice</label></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<!-- LiveKit client SDK (UMD build, pinned) -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.18.10/dist/livekit-client.umd.js"></script>
<script>
(() => {
  const { Room, RoomEvent, Track } = LivekitClient;

  const $ = (id) => document.getElementById(id);
  const orbWrap = $("orbWrap"), pill = $("pill"), pillText = $("pillText");
  const startBtn = $("startBtn"), startLabel = $("startLabel"), muteBtn = $("muteBtn"), endBtn = $("endBtn");
  const statusTitle = $("statusTitle"), statusSub = $("statusSub");
  const messages = $("messages"), empty = $("empty"), roomLabel = $("roomLabel");
  const unlockBtn = $("unlockBtn"), fbToggle = $("fbToggle");
  const checks = $("checks"), warnMsg = $("warnMsg"), testBtn = $("testBtn");
  let watchAgent = null, watchAudio = null;

  function setCheck(id, ok) { $(id).classList.toggle("ok", !!ok); }
  function showWarn(html) { warnMsg.innerHTML = html; warnMsg.classList.remove("hidden"); }
  function hideWarn() { warnMsg.classList.add("hidden"); }
  function hideAudioWarn() { if (warnMsg.dataset.kind === "audio") hideWarn(); }
  function resetChecks() { ["chkConn", "chkAgent", "chkAudio", "chkHeard"].forEach((c) => setCheck(c, false)); }
  const audioHost = document.createElement("div");
  audioHost.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden";
  document.body.appendChild(audioHost);

  // ----- equalizer bars -----
  const BAR_COUNT = 21;
  const bars = $("bars");
  for (let i = 0; i < BAR_COUNT; i++) bars.appendChild(document.createElement("span"));
  const barEls = [...bars.children];

  const STATES = {
    idle:         ["Ready when you are", "Press Start and say hello."],
    connecting:   ["Connecting…", "Setting up a secure voice session."],
    initializing: ["Waking up…", "Your assistant is joining the call."],
    listening:    ["Listening…", "Go ahead, I'm all ears."],
    thinking:     ["Thinking…", "Working out the best answer."],
    speaking:     ["Speaking", "Feel free to interrupt me anytime."],
  };

  let room = null;
  let agentState = "idle";
  let rafId = null;
  let smooth = 0;
  const segments = new Map(); // segmentId -> { el, bubble }
  let lastAgentAudioAt = 0;   // last time real agent audio was detected
  let fallbackToldUser = false;

  // Backup voice: reads text aloud with the browser's built-in voice
  function speakFallback(text) {
    if (!("speechSynthesis" in window) || !text.trim()) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 1.0;
    speechSynthesis.speak(u);
  }

  // ----- UI helpers -----
  function setState(s) {
    agentState = s;
    orbWrap.dataset.state = s;
    orbWrap.classList.toggle("active", !["idle", "connecting"].includes(s));
    const [t, sub] = STATES[s] || STATES.idle;
    statusTitle.textContent = t;
    statusSub.textContent = sub;
  }

  function setPill(kind, text) {
    pill.className = "pill " + (kind || "");
    pillText.textContent = text;
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 5000);
  }

  function addMessage(role, segmentId) {
    if (empty && empty.parentNode) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + role + " interim";
    el.innerHTML = '<div class="who"></div><div class="bubble"></div>';
    el.querySelector(".who").textContent = role === "agent" ? "Aria" : "You";
    messages.appendChild(el);
    const entry = { el, bubble: el.querySelector(".bubble") };
    segments.set(segmentId, entry);
    return entry;
  }

  function scrollDown() { messages.scrollTop = messages.scrollHeight; }

  // ----- transcription (LiveKit text streams) -----
  function registerTranscripts() {
    room.registerTextStreamHandler("lk.transcription", async (reader, participantInfo) => {
      const attrs = reader.info.attributes || {};
      const isFinal = attrs["lk.transcription_final"] === "true";
      const segId = attrs["lk.segment_id"] || reader.info.id;
      const isUser = participantInfo.identity === room.localParticipant.identity;
      const role = isUser ? "user" : "agent";
      if (isUser) setCheck("chkHeard", true);

      let entry = segments.get(segId) || addMessage(role, segId);

      try {
        if (isUser) {
          // user STT arrives as a full replacement of the text so far
          const text = await reader.readAll();
          entry.bubble.textContent = text;
        } else {
          // agent text streams in token by token
          let acc = "";
          const startedAt = performance.now();
          for await (const chunk of reader) {
            acc += chunk;
            entry.bubble.textContent = acc;
            scrollDown();
          }
          // If no agent audio was heard around this reply, the agent's voice is silent
          const silent = lastAgentAudioAt < startedAt - 1500;
          if (silent && fbToggle.checked) {
            speakFallback(acc);
            if (!fallbackToldUser) {
              fallbackToldUser = true;
              toast("Agent audio wasn't detected, so the browser voice is reading replies. Check the agent terminal for TTS errors.");
            }
          }
        }
      } catch (e) { console.warn("transcript stream error", e); }

      if (isFinal || !isUser) entry.el.classList.remove("interim");
      scrollDown();
    });
  }

  // ----- audio level animation (orb + bars) -----
  function animate() {
    let level = 0;
    if (room) {
      const agent = [...room.remoteParticipants.values()][0];
      const agentLevel = agent ? agent.audioLevel || 0 : 0;
      if (agentLevel > 0.02) { lastAgentAudioAt = performance.now(); setCheck("chkAudio", true); hideAudioWarn(); }
      const userLevel = room.localParticipant.isMicrophoneEnabled ? room.localParticipant.audioLevel || 0 : 0;
      level = Math.min(1, Math.max(agentLevel * 1.6, userLevel * 1.1));
    }
    smooth += (level - smooth) * 0.25;
    document.documentElement.style.setProperty("--level", smooth.toFixed(3));

    const t = performance.now() / 1000;
    barEls.forEach((b, i) => {
      const wave = (Math.sin(t * 5 + i * 0.7) + 1) / 2;
      const h = 6 + smooth * 20 * (0.35 + wave * 0.65);
      b.style.height = h.toFixed(1) + "px";
    });
    rafId = requestAnimationFrame(animate);
  }

  // ----- connect / disconnect -----
  async function start() {
    startBtn.disabled = true;
    startLabel.textContent = "Connecting…";
    setState("connecting");
    setPill("", "Connecting");

    try {
      const res = await fetch("/token");
      if (!res.ok) throw new Error("Token server returned " + res.status);
      const { token, url, room: roomName } = await res.json();

      room = new Room({ adaptiveStream: true, dynacast: true });

      room
        .on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === Track.Kind.Audio) {
            const el = track.attach();
            el.autoplay = true; el.volume = 1;
            audioHost.appendChild(el);
            const pr = el.play && el.play();
            if (pr && pr.catch) pr.catch(() => unlockBtn.classList.remove("hidden"));
          }
        })
        .on(RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((el) => el.remove()))
        .on(RoomEvent.ParticipantConnected, () => {
          setCheck("chkAgent", true);
          if (warnMsg.dataset.kind === "agent") hideWarn();
          if (agentState === "connecting") setState("initializing");
        })
        .on(RoomEvent.ParticipantAttributesChanged, (changed, participant) => {
          if (participant === room.localParticipant) return;
          const s = changed["lk.agent.state"];
          if (s && STATES[s]) setState(s);
        })
        .on(RoomEvent.AudioPlaybackStatusChanged, () => {
          unlockBtn.classList.toggle("hidden", room.canPlaybackAudio);
        })
        .on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
          // user started talking -> stop any backup-voice speech (barge-in)
          if (speakers.some((sp) => sp === room.localParticipant)) speechSynthesis.cancel();
        })
        .on(RoomEvent.Disconnected, () => cleanup());

      registerTranscripts();

      await room.connect(url, token);
      await room.startAudio();
      await room.localParticipant.setMicrophoneEnabled(true);

      roomLabel.textContent = roomName;
      setPill("live", "Live");
      setState(room.remoteParticipants.size ? "listening" : "initializing");
      checks.classList.remove("hidden");
      setCheck("chkConn", true);
      setCheck("chkAgent", room.remoteParticipants.size > 0);

      watchAgent = setTimeout(() => {
        if (room && room.remoteParticipants.size === 0) {
          warnMsg.dataset.kind = "agent";
          showWarn("The agent has not joined this room. Make sure it is running with <code>python agent.py start</code> in the same folder, using the same <code>.env.local</code> as the token server. Look for a line saying the worker is registered.");
        }
      }, 10000);
      watchAudio = setTimeout(() => {
        if (room && room.remoteParticipants.size > 0 && !checks.querySelector("#chkAudio").classList.contains("ok")) {
          warnMsg.dataset.kind = "audio";
          showWarn("The agent joined but no voice was heard yet. Press the speaker button to test your speakers, then check the agent terminal for <code>PIPELINE ERROR</code>.");
        }
      }, 20000);

      startBtn.classList.add("hidden");
      muteBtn.classList.remove("hidden");
      endBtn.classList.remove("hidden");
      if (!rafId) animate();
    } catch (err) {
      console.error(err);
      toast(err.name === "NotAllowedError" ? "Microphone access was blocked. Allow it and try again." : "Could not connect: " + err.message);
      setPill("error", "Error");
      await cleanup();
    }
  }

  async function cleanup() {
    if (room) { const r = room; room = null; try { await r.disconnect(); } catch {} }
    cancelAnimationFrame(rafId); rafId = null; smooth = 0;
    document.documentElement.style.setProperty("--level", 0);
    barEls.forEach((b) => (b.style.height = "6px"));
    audioHost.innerHTML = "";
    segments.clear();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    lastAgentAudioAt = 0; fallbackToldUser = false;
    unlockBtn.classList.add("hidden");
    clearTimeout(watchAgent); clearTimeout(watchAudio);
    checks.classList.add("hidden"); hideWarn(); resetChecks();
    muteBtn.classList.add("hidden"); muteBtn.classList.remove("muted");
    endBtn.classList.add("hidden");
    startBtn.classList.remove("hidden"); startBtn.disabled = false;
    startLabel.textContent = messages.querySelector(".msg") ? "Start a new conversation" : "Start conversation";
    roomLabel.textContent = "Not connected";
    if (pill.className.indexOf("error") === -1) setPill("", "Offline");
    setState("idle");
  }

  async function toggleMute() {
    if (!room) return;
    const enable = !room.localParticipant.isMicrophoneEnabled;
    await room.localParticipant.setMicrophoneEnabled(enable);
    muteBtn.classList.toggle("muted", !enable);
    muteBtn.title = enable ? "Mute microphone" : "Unmute microphone";
    statusSub.textContent = enable ? STATES[agentState][1] : "Your microphone is muted.";
  }

  testBtn.addEventListener("click", () => {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 660; g.gain.value = 0.12;
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.35);
    } catch (e) { console.warn(e); }
    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance("Speaker test. If you can hear this, your sound is working."));
    }
  });

  unlockBtn.addEventListener("click", async () => {
    try { if (room) await room.startAudio(); } catch (e) { console.warn(e); }
    audioHost.querySelectorAll("audio").forEach((a) => a.play().catch(() => {}));
    unlockBtn.classList.add("hidden");
  });

  startBtn.addEventListener("click", () => {
    // unlock browser speech on this click so the backup voice is allowed to talk later
    if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
    start();
  });
  endBtn.addEventListener("click", cleanup);
  muteBtn.addEventListener("click", toggleMute);
  setState("idle");
})();
</script>
</body>
</html>
